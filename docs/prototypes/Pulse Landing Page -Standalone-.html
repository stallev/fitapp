<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse — Ваш персональный тренер рядом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ═══ TOKENS ═══ */
:root {
  --forest: #2D5A40; --forest-dk: #1A3028; --forest-lt: #3D7A58; --forest-faint: #E4F0E8;
  --gold: #C4973A; --gold-lt: #E8C070; --gold-soft: #F5E6C8;
  --cream: #F5F0E8; --cream-dk: #EDE5D4; --cream-bd: #D8CCB4;
  --ink: #1A3028; --ink2: #4A5A50; --ink3: #8A8578;
  --serif: 'DM Serif Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
  --sh1: 0 1px 4px rgba(26,48,40,.07), 0 2px 8px rgba(26,48,40,.05);
  --sh2: 0 4px 16px rgba(26,48,40,.10), 0 2px 6px rgba(26,48,40,.06);
  --sh3: 0 8px 32px rgba(26,48,40,.13), 0 4px 12px rgba(26,48,40,.07);
  --sh4: 0 16px 48px rgba(26,48,40,.18), 0 8px 20px rgba(26,48,40,.10);
}

/* ═══ RESET ═══ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--sans); background: var(--cream); color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.6; }
p, h1, h2, h3, h4 { text-wrap: pretty; }
a { text-decoration: none; color: inherit; }
button { cursor: pointer; border: none; background: none; font: inherit; }

/* ═══ NAV ═══ */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: 72px; padding: 0 52px;
  display: flex; align-items: center; justify-content: space-between;
  transition: background .3s, box-shadow .3s;
}
.nav.scrolled { background: rgba(245,240,232,.95); backdrop-filter: blur(16px); box-shadow: 0 1px 0 rgba(26,48,40,.09); }
.nav-logo { font-family: var(--serif); font-size: 22px; letter-spacing: -.03em; }
.nav-links { display: flex; gap: 32px; list-style: none; }
.nav-links a { font-size: 14px; font-weight: 500; color: var(--ink2); transition: color .2s; white-space: nowrap; }
.nav-links a:hover { color: var(--forest); }
.nav-right { display: flex; align-items: center; gap: 10px; }

/* ═══ BUTTONS ═══ */
.btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--sans); font-weight: 500; cursor: pointer; border: none; white-space: nowrap; transition: all .2s; }
.btn-ghost { background: none; color: var(--ink2); font-size: 14px; padding: 8px 14px; border-radius: 999px; }
.btn-ghost:hover { background: var(--forest-faint); color: var(--forest); }
.btn-pill { background: var(--forest); color: white; font-size: 14px; font-weight: 600; padding: 10px 22px; border-radius: 999px; }
.btn-pill:hover { background: var(--forest-dk); box-shadow: 0 2px 12px rgba(26,48,40,.3); transform: translateY(-1px); }
.btn-lg { background: var(--forest); color: white; font-size: 16px; font-weight: 600; padding: 16px 36px; border-radius: 999px; }
.btn-lg:hover { background: var(--forest-dk); box-shadow: 0 4px 24px rgba(26,48,40,.35); transform: translateY(-2px); }
.btn-lg:active { transform: scale(.97); }
.btn-outline { background: transparent; color: var(--ink); font-size: 16px; font-weight: 500; padding: 15px 32px; border-radius: 999px; border: 1.5px solid var(--cream-bd); }
.btn-outline:hover { background: var(--cream-dk); border-color: var(--ink3); }
.btn-white { background: white; color: var(--forest-dk); font-size: 16px; font-weight: 600; padding: 16px 36px; border-radius: 999px; }
.btn-white:hover { background: var(--cream); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,0,0,.15); }
.btn-outline-white { background: transparent; color: white; font-size: 16px; font-weight: 500; padding: 15px 32px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.35); }
.btn-outline-white:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.6); }

/* ═══ LAYOUT ═══ */
.wrap { max-width: 1280px; margin: 0 auto; }
.sec { padding: 96px 56px; }
.slabel { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--forest); background: var(--forest-faint); padding: 6px 16px; border-radius: 999px; margin-bottom: 20px; }
.stitle { font-family: var(--serif); font-size: clamp(36px, 4vw, 52px); color: var(--ink); line-height: 1.05; letter-spacing: -.03em; margin-bottom: 14px; }
.ssub { font-size: 18px; color: var(--ink2); line-height: 1.65; max-width: 540px; }
.shead { text-align: center; margin-bottom: 68px; }
.shead .ssub { margin: 0 auto; }

/* ═══ REVEAL ═══ */
.rv { opacity: 0; transform: translateY(22px); transition: opacity .65s ease, transform .65s ease; }
.rv.in { opacity: 1; transform: none; }
.rv.d1 { transition-delay: .1s; } .rv.d2 { transition-delay: .2s; }
.rv.d3 { transition-delay: .3s; } .rv.d4 { transition-delay: .4s; }
.rv.d5 { transition-delay: .5s; }

/* ═══ HERO ═══ */
.hero { min-height: 100vh; display: flex; align-items: center; padding-top: 72px; overflow: hidden; position: relative; }
.hero::before { content: ''; position: absolute; top: -200px; right: -200px; width: 800px; height: 800px; background: radial-gradient(ellipse at center, rgba(228,240,232,.7) 0%, transparent 65%); pointer-events: none; }
.hero-inner { max-width: 1280px; margin: 0 auto; padding: 0 56px; width: 100%; display: grid; grid-template-columns: 1.15fr .85fr; gap: 64px; align-items: center; }
.hero-badge { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--forest); background: var(--forest-faint); border: 1px solid rgba(45,90,64,.12); padding: 7px 16px; border-radius: 999px; margin-bottom: 28px; }
.hero-title { font-family: var(--serif); font-size: clamp(50px, 5.8vw, 82px); color: var(--ink); line-height: .97; letter-spacing: -.045em; margin-bottom: 24px; }
.hero-title em { font-style: italic; color: var(--forest); }
.hero-sub { font-size: 18px; color: var(--ink2); line-height: 1.65; max-width: 460px; margin-bottom: 40px; }
.hero-ctas { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; flex-wrap: wrap; }
.hero-trust { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.trust-chip { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; color: var(--ink2); background: white; border: 1px solid var(--cream-bd); padding: 6px 12px; border-radius: 999px; box-shadow: var(--sh1); }
.hero-proof { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.proof-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink3); font-weight: 500; }
.proof-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--cream-bd); flex-shrink: 0; }

/* ═══ HERO VISUAL ═══ */
.hero-visual { position: relative; height: 540px; }
.hero-blob { position: absolute; inset: -60px; background: radial-gradient(ellipse 75% 75% at 55% 50%, rgba(228,240,232,.85) 0%, transparent 65%); border-radius: 60% 40% 50% 50% / 50% 50% 60% 40%; pointer-events: none; }
.fc { position: absolute; background: white; border-radius: 20px; box-shadow: var(--sh4); width: 215px; overflow: hidden; transition: transform .35s cubic-bezier(.34,1.4,.64,1), box-shadow .35s; }
.fc:hover { transform: translateY(-10px) rotate(0deg) !important; box-shadow: 0 28px 64px rgba(26,48,40,.22) !important; }
.fc-photo { height: 128px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.fc-photo::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.13) 1px, transparent 1px); background-size: 14px 14px; }
.fc-init { font-family: var(--serif); font-size: 44px; color: rgba(255,255,255,.55); font-style: italic; letter-spacing: -.04em; position: relative; z-index: 1; }
.fc-badge { position: absolute; top: 9px; right: 9px; background: white; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 600; color: var(--forest); display: flex; align-items: center; gap: 3px; z-index: 2; box-shadow: var(--sh1); }
.fc-body { padding: 13px 15px; }
.fc-name { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
.fc-spec { font-size: 12px; color: var(--ink3); margin-bottom: 9px; }
.fc-foot { display: flex; align-items: center; justify-content: space-between; }
.fc-price { font-size: 13px; font-weight: 700; color: var(--forest); }

/* ═══ TRUST BAR ═══ */
.trust-bar { background: var(--forest-dk); }
.trust-bar-inner { max-width: 1280px; margin: 0 auto; padding: 0 56px; display: grid; grid-template-columns: repeat(4,1fr); }
.ts { padding: 36px 20px; text-align: center; border-right: 1px solid rgba(255,255,255,.07); }
.ts:last-child { border-right: none; }
.ts-num { font-family: var(--serif); font-size: 46px; color: white; line-height: 1; letter-spacing: -.04em; display: block; margin-bottom: 7px; }
.ts-lbl { font-size: 13px; color: rgba(255,255,255,.5); }

/* ═══ HOW IT WORKS ═══ */
.steps-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 28px; }
.step-card { background: white; border-radius: 22px; padding: 36px 32px; box-shadow: var(--sh1); border: 1px solid rgba(26,48,40,.05); }
.step-num { font-family: var(--serif); font-size: 88px; color: var(--forest-faint); line-height: .88; letter-spacing: -.04em; margin-bottom: 24px; }
.step-icon { width: 48px; height: 48px; background: var(--forest-faint); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--forest); margin-bottom: 16px; }
.step-title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 10px; }
.step-desc { font-size: 15px; color: var(--ink2); line-height: 1.6; }

/* ═══ DISCIPLINES ═══ */
.disc-wrap { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.disc-pill { display: flex; align-items: center; gap: 10px; background: white; border: 1px solid var(--cream-bd); padding: 14px 26px; border-radius: 999px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all .2s; box-shadow: var(--sh1); }
.disc-pill:hover { background: var(--forest); color: white; border-color: var(--forest); transform: translateY(-2px); box-shadow: var(--sh2); }
.disc-pill:hover .disc-ct { color: rgba(255,255,255,.6); }
.disc-ct { font-size: 12px; color: var(--ink3); font-weight: 400; }

/* ═══ TRAINER CARDS ═══ */
.trainers-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; }
.tc { background: white; border-radius: 22px; overflow: hidden; box-shadow: var(--sh1); border: 1px solid rgba(26,48,40,.05); transition: transform .25s, box-shadow .25s; cursor: pointer; }
.tc:hover { transform: translateY(-7px); box-shadow: var(--sh3); }
.tc-photo { height: 200px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.tc-photo::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px); background-size: 14px 14px; }
.tc-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(26,48,40,.4) 0%, transparent 60%); z-index: 1; }
.tc-init { font-family: var(--serif); font-size: 56px; color: rgba(255,255,255,.45); font-style: italic; letter-spacing: -.04em; position: relative; z-index: 0; }
.tc-price { position: absolute; bottom: 14px; right: 14px; background: white; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; box-shadow: var(--sh1); z-index: 2; }
.tc-body { padding: 18px 20px; }
.tc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.tc-name { font-size: 17px; font-weight: 700; }
.tc-check { width: 22px; height: 22px; background: var(--forest-faint); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--forest); flex-shrink: 0; }
.tc-spec { font-size: 13px; color: var(--ink3); margin-bottom: 10px; }
.tc-rating { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); margin-bottom: 12px; }
.tc-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tc-tag { font-size: 12px; font-weight: 500; color: var(--forest); background: var(--forest-faint); padding: 4px 10px; border-radius: 999px; }
.trainers-ft { text-align: center; margin-top: 42px; }

/* ═══ TESTIMONIALS ═══ */
.testi-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; }
.testi { background: white; border-radius: 22px; padding: 36px 32px; box-shadow: var(--sh1); border: 1px solid rgba(26,48,40,.05); display: flex; flex-direction: column; }
.testi-mark { font-family: var(--serif); font-size: 72px; color: var(--forest-faint); line-height: .65; margin-bottom: 18px; }
.testi-stars { color: var(--gold); font-size: 14px; letter-spacing: 2px; margin-bottom: 14px; }
.testi-text { font-size: 16px; color: var(--ink); line-height: 1.65; margin-bottom: 28px; flex: 1; }
.testi-author { display: flex; align-items: center; gap: 12px; }
.testi-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: white; flex-shrink: 0; }
.testi-name { font-size: 14px; font-weight: 700; }
.testi-role { font-size: 12px; color: var(--ink3); margin-top: 2px; }

/* ═══ FOR TRAINERS ═══ */
.for-trainers { background: var(--forest-dk); padding: 96px 56px; }
.ft-inner { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr .9fr; gap: 80px; align-items: center; }
.ft-label { color: rgba(255,255,255,.5); background: rgba(255,255,255,.1); }
.ft-title { color: white; }
.ft-title em { font-style: italic; color: var(--gold-lt); }
.ft-sub { color: rgba(255,255,255,.6); max-width: 480px; }
.ft-benefits { display: flex; flex-direction: column; gap: 26px; margin: 36px 0; }
.ft-ben { display: flex; align-items: flex-start; gap: 16px; }
.ft-ben-icon { width: 44px; height: 44px; background: rgba(255,255,255,.08); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--gold-lt); flex-shrink: 0; }
.ft-ben-title { font-size: 16px; font-weight: 600; color: white; margin-bottom: 4px; }
.ft-ben-desc { font-size: 14px; color: rgba(255,255,255,.52); line-height: 1.5; }
.ft-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.ft-stat { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 28px 24px; }
.ft-stat-n { font-family: var(--serif); font-size: 40px; color: white; letter-spacing: -.04em; line-height: 1; margin-bottom: 8px; }
.ft-stat-l { font-size: 13px; color: rgba(255,255,255,.42); line-height: 1.4; }

/* ═══ FAQ ═══ */
.faq-list { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.faq-item { background: white; border-radius: 18px; overflow: hidden; border: 1px solid rgba(26,48,40,.06); }
.faq-q { display: flex; align-items: center; justify-content: space-between; padding: 22px 28px; cursor: pointer; transition: background .2s; user-select: none; }
.faq-q:hover { background: var(--cream); }
.faq-qt { font-size: 16px; font-weight: 600; color: var(--ink); }
.faq-ico { width: 28px; height: 28px; border-radius: 50%; background: var(--forest-faint); display: flex; align-items: center; justify-content: center; color: var(--forest); flex-shrink: 0; transition: transform .3s, background .2s; }
.faq-item.open .faq-ico { transform: rotate(45deg); background: var(--forest); color: white; }
.faq-a { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
.faq-item.open .faq-a { max-height: 220px; }
.faq-ai { padding: 0 28px 22px; font-size: 15px; color: var(--ink2); line-height: 1.65; }

/* ═══ FINAL CTA ═══ */
.final-cta { padding: 104px 56px; text-align: center; position: relative; overflow: hidden; }
.cta-wrap { max-width: 680px; margin: 0 auto; position: relative; z-index: 1; }
.cta-title { font-family: var(--serif); font-size: clamp(44px, 5.5vw, 70px); color: white; line-height: .97; letter-spacing: -.045em; margin-bottom: 20px; }
.cta-title em { font-style: italic; color: var(--gold-lt); }
.cta-sub { font-size: 18px; color: rgba(255,255,255,.68); line-height: 1.6; margin-bottom: 48px; }
.cta-btns { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
.cta-circle { position: absolute; border-radius: 50%; background: rgba(255,255,255,.05); pointer-events: none; }

/* ═══ FOOTER ═══ */
.footer { background: var(--cream-dk); padding: 44px 56px; border-top: 1px solid var(--cream-bd); }
.footer-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.footer-logo { font-family: var(--serif); font-size: 20px; letter-spacing: -.03em; }
.footer-tag { font-size: 12px; color: var(--ink3); margin-top: 4px; }
.footer-links { display: flex; gap: 28px; }
.footer-links a { font-size: 13px; color: var(--ink3); transition: color .2s; }
.footer-links a:hover { color: var(--forest); }
.footer-copy { font-size: 12px; color: var(--ink3); }

/* ═══ TWEAKS PANEL ═══ */
.tweaks-panel { position: fixed; bottom: 24px; right: 24px; z-index: 1000; background: white; border-radius: 20px; box-shadow: var(--sh4); padding: 22px; width: 258px; border: 1px solid rgba(26,48,40,.08); }
.tp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.tp-title { font-size: 13px; font-weight: 700; color: var(--ink); }
.tp-close { width: 26px; height: 26px; border-radius: 50%; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink2); cursor: pointer; border: none; transition: background .15s; }
.tp-close:hover { background: var(--cream-bd); }
.tp-group { margin-bottom: 18px; }
.tp-group:last-child { margin-bottom: 0; }
.tp-glabel { font-size: 11px; font-weight: 600; color: var(--ink3); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px; }
.tp-swatches { display: flex; gap: 9px; }
.tp-swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all .15s; box-shadow: var(--sh1); }
.tp-swatch.on { border-color: var(--ink); transform: scale(1.12); }
.tp-opts { display: flex; gap: 7px; flex-wrap: wrap; }
.tp-opt { font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 999px; cursor: pointer; background: var(--cream); color: var(--ink2); border: 1px solid var(--cream-bd); transition: all .15s; }
.tp-opt.on { background: var(--forest-faint); color: var(--forest); border-color: transparent; }
.tp-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--ink2); }
.tp-toggle { width: 40px; height: 22px; border-radius: 11px; background: var(--cream-bd); cursor: pointer; position: relative; transition: background .2s; flex-shrink: 0; }
.tp-toggle.on { background: var(--forest); }
.tp-toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.tp-toggle.on::after { transform: translateX(18px); }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 1024px) {
  .hero-inner { grid-template-columns: 1fr; }
  .hero-visual { display: none; }
  .ft-inner { grid-template-columns: 1fr; gap: 48px; }
  .ft-stats { display: grid; grid-template-columns: repeat(4,1fr); }
  .trainers-grid { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 768px) {
  .nav-links { display: none; }
  .nav { padding: 0 24px; }
  .sec { padding: 64px 24px; }
  .hero-inner { padding: 0 24px; }
  .trust-bar-inner { padding: 0 24px; grid-template-columns: repeat(2,1fr); }
  .ts { border-right: none; border-bottom: 1px solid rgba(255,255,255,.07); padding: 24px 16px; }
  .ts:nth-child(3), .ts:last-child { border-bottom: none; }
  .steps-grid, .trainers-grid, .testi-grid { grid-template-columns: 1fr; }
  .for-trainers { padding: 64px 24px; }
  .ft-stats { grid-template-columns: repeat(2,1fr); }
  .final-cta { padding: 72px 24px; }
  .footer { padding: 40px 24px; }
  .footer-inner { flex-direction: column; gap: 24px; text-align: center; }
  .footer-links { flex-wrap: wrap; justify-content: center; gap: 20px; }
}

</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

/* ─── HOOKS ─── */
function useScrolled() {
  const [s, setS] = useState(false);
  useEffect(() => {
    const fn = () => setS(window.scrollY > 8);
    window.addEventListener('scroll', fn, {passive:true});
    fn();
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return s;
}

function useReveal() {
  useEffect(() => {
    const els = Array.from(document.querySelectorAll('.rv'));
    els.forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight * 1.1) {
        el.style.transition = 'none';
        el.style.transitionDelay = '0s';
        el.style.opacity = '1';
        el.style.transform = 'none';
        el.classList.add('in');
      }
    });
    const ob = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.style.transition = '';
          e.target.style.transitionDelay = '';
          e.target.classList.add('in');
          ob.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    els.forEach(el => { if (!el.classList.contains('in')) ob.observe(el); });
    return () => ob.disconnect();
  }, []);
}

function useCount(target, go) {
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!go) return;
    const dur = 1600, t0 = Date.now();
    const tick = () => {
      const p = Math.min(1, (Date.now()-t0)/dur);
      setN(Math.round((1-Math.pow(1-p,3))*target));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, [go, target]);
  return n;
}

/* ─── TRUST BAR ─── */
function TrustBar({ show }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    if (!show || !ref.current) return;
    const ob = new IntersectionObserver(([e]) => { if(e.isIntersecting){setVis(true);ob.disconnect();} }, {threshold:0.4});
    ob.observe(ref.current);
    return () => ob.disconnect();
  }, [show]);
  const c1 = useCount(200, vis), c2 = useCount(10000, vis), c3 = useCount(98, vis), c4 = useCount(49, vis);
  if (!show) return null;
  return (
    <div className="trust-bar" ref={ref}>
      <div className="trust-bar-inner">
        <div className="ts"><span className="ts-num">{c1}+</span><span className="ts-lbl">Certified Trainers</span></div>
        <div className="ts"><span className="ts-num">{c2.toLocaleString('en-US')}+</span><span className="ts-lbl">Sessions Booked</span></div>
        <div className="ts"><span className="ts-num">{c3}%</span><span className="ts-lbl">Client Satisfaction</span></div>
        <div className="ts"><span className="ts-num">{(c4/10).toFixed(1)}★</span><span className="ts-lbl">Average Rating</span></div>
      </div>
    </div>
  );
}

            <div key={c.v} className={`tp-swatch${t.primaryColor===c.v?' on':''}`}
              style={{background:c.v}} title={c.label}
              onClick={()=>set('primaryColor',c.v)}></div>
          ))}
        </div>
      </div>
      <div className="tp-group">
        <div className="tp-glabel">Hero Layout</div>
        <div className="tp-opts">
          {[['split','Split'],['centered','Centered']].map(([v,l]) => (
            <div key={v} className={`tp-opt${t.heroVariant===v?' on':''}`}
              onClick={()=>set('heroVariant',v)}>{l}</div>
          ))}
        </div>
      </div>
      <div className="tp-group">
        <div className="tp-row">
          <span>Stats Bar</span>
          <div className={`tp-toggle${t.showTrustBar?' on':''}`}
            onClick={()=>set('showTrustBar',!t.showTrustBar)}></div>
        </div>
      </div>
    </div>
  );
}

/* ─── APP ─── */
function App() {
  const [tweaks, setTweaks] = useState(TWEAKS);
  const [panelOpen, setPanelOpen] = useState(false);
  useReveal();

  function set(key, val) {
    setTweaks(prev => ({...prev,[key]:val}));
    window.parent.postMessage({type:'__edit_mode_set_keys',edits:{[key]:val}},'*');
  }

  useEffect(() => {
    const handler = e => {
      if (e.data?.type==='__activate_edit_mode') setPanelOpen(true);
      if (e.data?.type==='__deactivate_edit_mode') setPanelOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      <Nav color={tweaks.primaryColor}/>
      <Hero color={tweaks.primaryColor} variant={tweaks.heroVariant}/>
      <TrustBar show={tweaks.showTrustBar}/>
      <HowItWorks/>
      <Disciplines/>
      <FeaturedTrainers color={tweaks.primaryColor}/>
      <Testimonials/>
      <ForTrainers/>
      <FAQ/>
      <FinalCTA color={tweaks.primaryColor}/>
      <Footer/>
      {panelOpen && (
        <TweaksPanel t={tweaks} set={set} onClose={()=>{
          setPanelOpen(false);
          window.parent.postMessage({type:'__edit_mode_dismissed'},'*');
        }}/>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
